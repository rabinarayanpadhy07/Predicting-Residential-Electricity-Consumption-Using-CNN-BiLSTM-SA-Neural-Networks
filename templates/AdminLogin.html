<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Residential Electricity Consumption</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='default.css') }}">
  <script>
    function validate(formObj) {
      if (formObj.t1.value.trim().length === 0) {
        alert("Please enter a username");
        formObj.t1.focus();
        return false;
      }
      if (formObj.t2.value.trim().length === 0) {
        alert("Please enter a password");
        formObj.t2.focus();
        return false;
      }
      return true;
    }
  </script>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">
      <h2>Electricity Forecaster</h2>
    </div>
    <nav>
      <ul>
        <li><a href="index">Home</a></li>
        <li><a href="AdminLogin" class="active">Admin Login</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrapper">
  <div class="card login-card">
    <div class="featured-image-container">
      {% include 'cnn_bilstm_attention_animation.html' %}
    </div>

    <h1 class="card-title">Admin Access</h1>

    {% if msg %}
    <div class="message error">
      {{ msg|safe }}
    </div>
    {% endif %}

    <form name="f1" method="post" action="/AdminLoginAction" onsubmit="return validate(this);">
      <div class="form-group">
        <label class="form-label" for="t1">Username</label>
        <input
          type="text"
          id="t1"
          name="t1"
          class="form-control"
          placeholder="Enter your username"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="t2">Password</label>
        <input
          type="password"
          id="t2"
          name="t2"
          class="form-control"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn">Login to Dashboard</button>
    </form>
  </div>
</main>

<footer>
  <p>&copy; Predicting Residential Electricity Consumption &nbsp;||&nbsp; All Rights Reserved</p>
</footer>

</body>
</html>
